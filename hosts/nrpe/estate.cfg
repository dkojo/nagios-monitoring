# The checks NRPE will run when the Nagios server asks. Thresholds live here, in Git.
command[check_load]=/usr/lib/nagios/plugins/check_load -r -w 4,3,2 -c 8,6,4
command[check_root]=/usr/lib/nagios/plugins/check_disk -w 10% -c 5% -p /
command[check_nginx]=/usr/lib/nagios/plugins/check_procs -c 1: -C nginx
command[check_data]=/usr/lib/nagios/plugins/check_disk -w 3% -c 1% -p /data
command[check_backup]=/usr/local/lib/nagios/check_backup_age -w 24 -c 26 -d /backups
command[check_cert]=/usr/local/lib/nagios/check_cert_expiry -w 30 -c 7 -f /etc/ssl/files/server.crt
# Self-healing: the only change NRPE may make, and only through this one sudo rule
command[restart_nginx]=/usr/bin/sudo /usr/sbin/nginx
