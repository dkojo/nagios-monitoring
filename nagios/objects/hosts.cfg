# The estate: four Linux servers, each running the NRPE agent on :5666.
define host {
    use                     estate-host
    host_name               web
    alias                   nginx web server
    address                 10.43.0.11
}

define host {
    use                     estate-host
    host_name               app
    alias                   application server, nightly backups
    address                 10.43.0.12
}

define host {
    use                     estate-host
    host_name               db
    alias                   database server, /data volume
    address                 10.43.0.13
}

define host {
    use                     estate-host
    host_name               files
    alias                   file server, TLS
    address                 10.43.0.14
}
