# What is checked on each host. Stock plugins run through NRPE; the custom Bash checks live in hosts/plugins/.

define service {
    use                     estate-service
    host_name               web
    service_description     Load
    check_command           check_nrpe!check_load
}

define service {
    use                     estate-service
    host_name               web
    service_description     Root disk
    check_command           check_nrpe!check_root
}

define service {
    use                     estate-service
    host_name               app
    service_description     Load
    check_command           check_nrpe!check_load
}

define service {
    use                     estate-service
    host_name               app
    service_description     Root disk
    check_command           check_nrpe!check_root
}

define service {
    use                     estate-service
    host_name               db
    service_description     Load
    check_command           check_nrpe!check_load
}

define service {
    use                     estate-service
    host_name               db
    service_description     Root disk
    check_command           check_nrpe!check_root
