# web: HTTP from the Nagios server. If it goes HARD CRITICAL, the event handler restarts nginx over NRPE.
define service {
    use                     estate-service
    host_name               web
    service_description     HTTP
    check_command           check_http
    event_handler           restart-nginx
    event_handler_enabled   1
}

define service {
    use                     estate-service
    host_name               web
    service_description     nginx process
    check_command           check_nrpe!check_nginx
}

define service {
    use                     estate-service
    host_name               app
    service_description     Backup age
    check_command           check_nrpe!check_backup
}

define service {
    use                     estate-service
    host_name               db
    service_description     Data disk
    check_command           check_nrpe!check_data
}

define service {
    use                     estate-service
    host_name               files
    service_description     TLS cert
    check_command           check_nrpe!check_cert
}
