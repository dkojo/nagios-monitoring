# Defaults every host and service inherits. Times are seconds (interval_length=1).
define timeperiod {
    timeperiod_name         24x7
    alias                   Always
    sunday                  00:00-24:00
    monday                  00:00-24:00
    tuesday                 00:00-24:00
    wednesday               00:00-24:00
    thursday                00:00-24:00
    friday                  00:00-24:00
    saturday                00:00-24:00
}

define contact {
    contact_name                    oncall
    alias                           On-call engineer
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r
    service_notification_options    w,c,r
    host_notification_commands      notify-host-webhook
    service_notification_commands   notify-service-webhook
}

define host {
    name                    estate-host
    check_command           check-host-alive
    check_interval          10
    retry_interval          3
    max_check_attempts      2
    check_period            24x7
    notification_period     24x7
    notification_interval   0
    notification_options    d,u,r
    contacts                oncall
    register                0
}

define service {
    name                    estate-service
    check_interval          10
    retry_interval          3
    max_check_attempts      2
    check_period            24x7
    notification_period     24x7
    notification_interval   0
    notification_options    w,c,r
    contacts                oncall
    register                0
}
