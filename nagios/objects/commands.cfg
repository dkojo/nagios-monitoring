# How Nagios runs checks, sends alerts and heals.
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 5666 -t 5
}
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -t 15 -c $ARG1$
}
define command {
    command_name    check_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -t 5
}
define command {
    command_name    notify-service-webhook
    command_line    /usr/local/bin/notify-webhook "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICESTATE$" "$SERVICEOUTPUT$"
}
define command {
    command_name    notify-host-webhook
    command_line    /usr/local/bin/notify-webhook "$NOTIFICATIONTYPE$" "$HOSTNAME$" "HOST" "$HOSTSTATE$" "$HOSTOUTPUT$"
}
define command {
    command_name    restart-nginx
    command_line    /usr/local/bin/restart-nginx $SERVICESTATE$ $SERVICESTATETYPE$ $HOSTADDRESS$
}
